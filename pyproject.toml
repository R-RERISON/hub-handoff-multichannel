[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "handoff-hub"
version = "0.1.0.dev0"
description = "Independent multichannel human handoff orchestration platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "httpx>=0.27,<1.0",
  "ruff>=0.8,<1.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
